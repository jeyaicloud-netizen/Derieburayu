<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyAPK Signer</title>
    <meta
      name="description"
      content="Sign Android APKs from Java N-IDE with v1, v2, and v3 signatures and use Tiny Note offline as an installable PWA."
    />
    <meta property="og:title" content="TinyAPK Signer" />
    <meta
      property="og:description"
      content="Sign Android APKs from Java N-IDE with v1, v2, and v3 signatures and use Tiny Note offline as an installable PWA."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tiny Note" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.__tinyNoteDeferredPrompt = null;
      window.__tinyNoteInstalled = false;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__tinyNoteDeferredPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__tinyNoteInstalled = true;
        window.__tinyNoteDeferredPrompt = null;
      });
      (function () {
        var p = window.location.pathname;
        var sp = new URLSearchParams(window.location.search);
        var q = new URLSearchParams();
        if (sp.get('relay')) q.set('relay', sp.get('relay'));
        if (sp.get('room')) q.set('room', sp.get('room'));
        var qs = q.toString() ? '?' + q.toString() : '';
        var nextHref = null;
        if (p.indexOf('/w/') === 0) {
          document.title = 'Tiny Note';
          nextHref = '/api/manifest/tiny.webmanifest?w=' + encodeURIComponent(p.slice(3).split('/')[0]);
        } else if (p === '/w') {
          document.title = 'Tiny Note';
          nextHref = '/api/manifest/tiny.webmanifest?w=1' + (qs ? '&' + qs.slice(1) : '');
        } else if (p.indexOf('/t/') === 0) {
          document.title = 'Tiny Note';
          nextHref = '/api/manifest/tiny.webmanifest?t=' + encodeURIComponent(p.slice(3).split('/')[0]);
        } else if (p === '/app2' || p.indexOf('/app2/') === 0) {
          document.title = 'Tiny Note';
          var c2 = p.indexOf('/app2/') === 0 ? p.slice(6).split('/')[0] : '';
          nextHref = c2 ? '/api/manifest/tiny.webmanifest?t=' + encodeURIComponent(c2) : '/api/manifest/tiny.webmanifest' + qs;
        } else if (p === '/note') {
          document.title = 'Tiny Note';
          nextHref = '/api/manifest/tiny.webmanifest' + qs;
        } else if (p.indexOf('/a/') === 0) {
          document.title = 'App 1 Controller';
          nextHref = '/api/manifest/app1.webmanifest?a=' + encodeURIComponent(p.slice(3).split('/')[0]);
        } else if (p === '/app1') {
          document.title = 'App 1 Controller';
          nextHref = '/api/manifest/app1.webmanifest' + qs;
        }
        if (!nextHref) return;
        function applyManifest() {
          var link = document.querySelector('link[rel="manifest"]');
          if (link) {
            if (link.getAttribute('href') !== nextHref) link.setAttribute('href', nextHref);
            return true;
          }
          return false;
        }
        if (!applyManifest() && typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(function () {
            if (applyManifest()) obs.disconnect();
          });
          obs.observe(document.head, { childList: true });
          document.addEventListener('DOMContentLoaded', function () {
            applyManifest();
            obs.disconnect();
          });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
