<html lang="en">

    />
    <meta property="og:title" content="TinyAPK Signer" />
    <meta
      property="og:description"
      content="Sign Android APKs from Java N-IDE with v1, v2, and v3 signatures and use PersistentUssdCast PWA for Android 8-16."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />

    />
    <script>
      window.__tinyNoteDeferredPrompt = null;
      window.__tinyNoteInstalled = false;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__tinyNoteDeferredPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__tinyNoteInstalled = true;
        window.__tinyNoteDeferredPrompt = null;
      });
    </script>

  <body class="bg-slate-50 text-slate-900 antialiased">
